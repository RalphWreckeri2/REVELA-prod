name: Database backup image validation

on:
  push:
    branches:
      - ci/database-backup-image-validation

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build backend image without publishing it
        run: |
          docker build --pull \
            --build-arg MYSQL_APT_COMPONENT=mysql-9.7-lts \
            --build-arg MYSQL_CLIENT_VERSION=9.7.4-1debian12 \
            --tag "revela-backend:ci-${GITHUB_SHA}" \
            ./revela_backend
